<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Samsung - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/estiloLogin.css}">
</head>

<body>
    <!-- Decoraciones de fondo -->
    <div class="decorative-circle-bottom"></div>
    <div class="decorative-grid"></div>
    <div class="decorative-lines"></div>

    <div class="container">
        <div class="storefront">
            <div class="header">
                <img th:src="@{/imagenes/logo-samsung.png}" alt="Samsung Logo">
            </div>
            <div class="body-content">
                <div class="welcome-section">
                    <h2>¡Bienvenidos!</h2>
                    <p>Gestiona todas las incidencias de manera eficiente.</p>
                </div>

                <div class="login-section">
                    <h3>Iniciar Sesión</h3>

                    <!-- Mensaje de error -->
                    <div th:if="${error}" class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
                    </div>

                    <!-- Mensaje de éxito -->
                    <div th:if="${success}" class="alert alert-success" role="alert">
                        <i class="fas fa-check-circle"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
                    </div>

                    <!-- Mensaje de logout -->
                    <div th:if="${message}" class="alert alert-info" role="alert">
                        <i class="fas fa-info-circle"></i>
                        <span th:text="${message}"></span>
                        <button type="button" class="btn-close" onclick="this.parentElement.style.display='none'">×</button>
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="form-group">
                            <div class="input-wrapper">
                                <input type="email" class="form-control" id="correo" name="correo" 
                                       placeholder=" " required>
                                <label for="correo">
                                    <i class="fas fa-envelope"></i> Correo Electrónico
                                </label>
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="input-wrapper">
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder=" " required>
                                <label for="password">
                                    <i class="fas fa-lock"></i> Contraseña
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btnAcceder">
                            <span>
                                <i class="fas fa-arrow-right"></i>
                                Acceder
                            </span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
